# Supabase CLI local config (https://supabase.com/docs/guides/local-development)
project_id = "dreamsprout"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3001"
enable_signup = true

[functions.generate-narration]
verify_jwt = true
