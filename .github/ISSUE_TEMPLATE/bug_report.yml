name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iOS, Android, Web, Studio, Supabase]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
