name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: kids
    attributes:
      label: Child safety
      options:
        - label: This adds no ads, tracking, external links, purchases or permissions to the child experience
