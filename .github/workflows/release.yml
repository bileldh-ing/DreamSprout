name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build changelog since previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}${GITHUB_REF_NAME}
          {
            echo "## What's changed"
            git log --pretty='- %s (%h)' $RANGE
            echo
            echo "See CHANGELOG.md for curated notes."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "DreamSprout $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag

  eas-update:
    needs: release
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: Check for EXPO_TOKEN and EAS_PROJECT_ID
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::notice title=EAS Update skipped::Set secrets.EXPO_TOKEN and vars.EAS_PROJECT_ID to publish OTA updates."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - name: Publish OTA update to the production channel
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        run: eas update --channel production --message "Release ${GITHUB_REF_NAME}" --non-interactive
