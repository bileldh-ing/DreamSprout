name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · typecheck · tests · content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Content validation (sources, licences, images, audio, timings)
        run: npm run validate:content
      - name: Seed is up to date
        run: |
          npm run seed:build
          npx prettier --write scripts/build-seed.mjs > /dev/null
          git diff --exit-code -- supabase/seed.sql apps/mobile/src/content/assets.generated.ts
      - name: Unit tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/mobile/coverage
            apps/studio/coverage
            packages/content/coverage
          if-no-files-found: ignore

  mobile-web:
    name: Expo web export · expo-doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: expo-doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export web build
        working-directory: apps/mobile
        run: npx expo export -p web --output-dir dist
        env:
          CI: 1
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-web-dist
          path: apps/mobile/dist

  studio:
    name: Studio build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: next build
        run: npm run studio:build
        env:
          NEXT_TELEMETRY_DISABLED: 1
