name: Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Apply migrations + seed, lint, RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations + seed.sql)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta
      - name: Lint schema
        run: supabase db lint --local --level error --fail-on error
      - name: RLS & publish-gate tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_and_rights.sql
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: s
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice title=Supabase deploy skipped::Set secrets.SUPABASE_ACCESS_TOKEN, secrets.SUPABASE_DB_PASSWORD and vars.SUPABASE_PROJECT_REF to deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.s.outputs.go == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.s.outputs.go == 'true'
        with:
          version: latest
      - name: Link, push migrations, deploy edge function
        if: steps.s.outputs.go == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          supabase functions deploy generate-narration --project-ref "$SUPABASE_PROJECT_REF"
